[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinsamlib"
version = "0.1.0"
description = "Vintage sampler library browser and bank builder for E-mu E4B/EIII and Kurzweil KRZ formats"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
dependencies = [
    "PySide6==6.11.1",
]

[project.optional-dependencies]
# numpy is an ACCELERATOR, never a gate. Audition renders without it and says
# so in a speed note rather than refusing; with it the renderer's vectorised
# path is roughly twice as fast on a filtered preset and much more on an
# unfiltered one. Set VINSAMLIB_NO_NUMPY=1 to run the pure-Python path even
# when it is installed, which is how the two are compared.
speed = [
    "numpy>=1.24",
]
dev = [
    "pytest>=7",
]

[project.scripts]
vinsamlib = "vinsamlib.app:main"

[tool.setuptools.packages.find]
include = ["vinsamlib*"]
