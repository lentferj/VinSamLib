[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vinsamlib"
version = "0.1.0"
description = "Vintage sampler library browser and bank builder for E-mu E4B and Kurzweil KRZ formats"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-or-later" }
dependencies = [
    "PySide6==6.11.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[project.scripts]
vinsamlib = "vinsamlib.app:main"

[tool.setuptools.packages.find]
include = ["vinsamlib*"]
